<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./defaults/Paw.Logo.jpg">
  <title>Home - PetConnect</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="page-container">

  <div class="hero-section">

    <div class="content-left animate-fade">
      <img src="https://placedog.net/500/350" class="hero-header-img" alt="Hero Pets">
      
      <h1 class="logo">🐾 PetConnect</h1>

      <p class="tagline delay-1">
        A cozy social space for pet lovers. Share moments, discover adorable pets,
        and connect with a community that loves animals as much as you do.
      </p>
    </div>

    <div class="content-right animate-fade delay-2">
      <div class="image-container">
        <img src="https://placedog.net/200/300" 
            class="pet-image float-slow" alt="Cute Pet 1">

        <img src="https://placedog.net/250/200" 
            class="pet-image float-med" alt="Cute Pet 2">

        <img src="https://placedog.net/300/200" 
            class="pet-image float-fast" alt="Cute Pet 3">
      </div>

      <div class="button-group delay-3">
        <a href="./pages/login.html" class="btn btn-primary">Sign In</a>
        <a href="./pages/signup.html" class="btn btn-secondary">Sign up</a>
        <a href="./pages/feed.html" class="btn btn-secondary">Go To Feed</a>
      </div>
    </div>
  </div>
</body>
</html>
