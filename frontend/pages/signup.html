<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./defaults/Paw.Logo.jpg">
  <title>SignUp - PetConnect</title>
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="page-container">

  <main class="auth-wrapper">
    <section class="promo-section">
      <img src="https://placedog.net/500/350" class="promo-image" alt="Cozy Dog">
      <h1 class="brand-logo">🐾 PetConnect</h1>
      <p class="brand-description">
        Join our community of animal lovers! Create a profile for your furry, 
        feathery, or flowy friends, and start sharing those pawsome moments 
        with the world.
      </p>
    </section>
  
    <section class="auth-card">
      <h2 class="auth-title">Create Account</h2>

      <div class="auth-form">
        <div class="input-group">
          <input type="text" id="name" placeholder="Full Name" required />
          <input type="text" id="username" placeholder="Username" required />
          <input type="email" id="email" placeholder="Email" required />
          <input type="text" id="bio" placeholder="Bio" />
          <input type="password" id="password" placeholder="Password" required />
        </div>

        <div class="avatar-selection">
          <p class="avatar-label">Choose your avatar:</p>
          <div id="avatars" class="avatar-grid">
            <img src="../defaults/avatar1.jpg" onclick="selectAvatar(this)" alt="Avatar 1" />
            <img src="../defaults/avatar2.jpg" onclick="selectAvatar(this)" alt="Avatar 2" />
            <img src="../defaults/avatar3.jpg" onclick="selectAvatar(this)" alt="Avatar 3" />
            <img src="../defaults/avatar4.jpg" onclick="selectAvatar(this)" alt="Avatar 4" />
            <img src="../defaults/avatar5.jpg" onclick="selectAvatar(this)" alt="Avatar 5" />
            <img src="../defaults/avatar7.jpg" onclick="selectAvatar(this)" alt="Avatar 7" />
          </div>
        </div>

        <button type="submit" onclick="signup()" class="btn-submit">Signup</button>
      </div>

      <p class="auth-footer">
        Already have account? <a href="login.html">Sign in</a>
      </p>
    </section>
  </main>

  <script type="module" src="../js/auth.js"></script>
</body>
</html>
