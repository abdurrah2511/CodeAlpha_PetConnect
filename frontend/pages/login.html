<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="./defaults/Paw.Logo.jpg">
  <title>SignIn - PetConnect</title>
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body class="page-container">
  
  <main class="auth-wrapper">
    <section class="promo-section">
        <img src="https://placedog.net/500/350" class="promo-image" alt="Cozy Cat">
        <h1 class="brand-logo">🐾 PetConnect</h1>
        <p class="brand-description">
          A cozy space for pet lovers to share moments, connect with other owners,
          and celebrate the joy of pets. Post photos, follow adorable friends,
          and build your pet’s social world.
        </p>
    </section>

    <section class="auth-card">
      <h2 class="auth-title">Welcome Back</h2>

      <div class="auth-form">
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit" onclick="login()" class="btn-submit">Login</button>
      </div>

      <p class="auth-footer">
        Don't have an account? <a href="signup.html">Sign up</a>
      </p>
    </section>
  </main>

  <script type="module" src="../js/auth.js"></script>
</body>
</html>
